<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f1e8"><title>Бутик на Холмах</title><link rel="stylesheet" href="./styles.css"><script src="https://st.max.ru/js/max-web-app.js"></script></head>
<body><header><div><div class="eyebrow">КАТАЛОГ</div><h1>Бутик на Холмах</h1><p id="hello">Палантины, кашемир и украшения из наших путешествий</p></div><button id="cartBtn" class="cart">Корзина <span id="cartCount">0</span></button></header>
<main><section class="controls"><input id="search" placeholder="Поиск по каталогу"><select id="category"><option value="">Все категории</option></select></section><section id="products" class="grid"></section></main>
<div id="drawer" class="drawer" aria-hidden="true"><div class="drawer-head"><h2>Корзина</h2><button id="closeCart">×</button></div><div id="cartItems"></div><div class="total"><span>Итого</span><strong id="total">0 ₽</strong></div><button id="checkoutBtn" class="primary">Оформить заказ</button></div><div id="overlay" class="overlay"></div>
<dialog id="checkout"><button id="closeCheckout" class="x">×</button><h2>Оформление заказа</h2><p class="muted">Мы получим заказ в MAX и сможем связаться с вами.</p><label>Имя<input id="name" autocomplete="name"></label><label>Телефон или @username<input id="contact" autocomplete="tel"></label><label>Комментарий<textarea id="comment" rows="3" placeholder="Например, город доставки или пожелания"></textarea></label><button id="sendOrder" class="primary">Отправить заказ</button><p id="status" class="status"></p></dialog>
<script src="./app.js"></script></body></html>
